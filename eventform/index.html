<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Event ticket sign-up form for students and guests.">
  <title>Event Ticket Form</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <section class="form-card" aria-labelledby="page-title">
      <div class="card-heading">
        <h1 id="page-title">Event Ticket</h1>
      </div>

      <form id="ticket-form" novalidate>
        <div class="two-column">
          <div class="field-group">
            <label for="first-name">First Name</label>
            <input id="first-name" name="firstName" type="text" autocomplete="given-name" required>
          </div>

          <div class="field-group">
            <label for="last-name">Last Name</label>
            <input id="last-name" name="lastName" type="text" autocomplete="family-name" required>
          </div>
        </div>

        <div class="field-group">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="two-column">
          <div class="field-group">
            <label for="attendee-type">Type</label>
            <select id="attendee-type" name="attendeeType" required>
              <option value="">Choose one</option>
              <option value="student">Student</option>
              <option value="guest">Guest</option>
            </select>
          </div>

          <div class="field-group">
            <label for="event-date">Event Date</label>
            <input id="event-date" name="eventDate" type="date" required>
          </div>
        </div>

        <div class="field-group hidden" id="credential-group">
          <label for="credential" id="credential-label">Student I#</label>
          <input id="credential" name="credential" type="text" autocomplete="off">
          <p class="field-hint" id="credential-hint">Enter your 9 digit student I number.</p>
        </div>

        <button type="submit">Create Ticket</button>
      </form>

      <div id="form-errors" class="message error-message" role="alert" aria-live="polite" hidden></div>
      <div id="ticket-result" class="ticket-result" role="status" aria-live="polite" hidden></div>
    </section>
  </main>
</body>
</html>
