<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Rowkeeper app wireframe</title>
  <desc id="desc">A grayscale wireframe showing the chart workspace and the project library with active and completed sections.</desc>
  <style>
    .line{fill:none;stroke:#315b49;stroke-width:3}.soft{fill:#eef1e6;stroke:#315b49;stroke-width:2}.label{fill:#253b31;font:700 22px system-ui,sans-serif}.small{fill:#758076;font:18px system-ui,sans-serif}.title{fill:#253b31;font:700 30px Georgia,serif}
  </style>
  <rect width="1200" height="760" fill="#f7f6f0"/>
  <rect x="35" y="30" width="1130" height="70" rx="12" fill="#fffefb" stroke="#dedfd5" stroke-width="2"/>
  <circle cx="75" cy="65" r="22" class="soft"/><text x="112" y="74" class="title">rowkeeper</text>
  <rect x="805" y="48" width="120" height="34" rx="8" class="soft"/><text x="824" y="71" class="small">My projects</text>
  <rect x="940" y="48" width="100" height="34" rx="8" class="soft"/><text x="963" y="71" class="small">Replace</text>
  <rect x="1055" y="48" width="115" height="34" rx="8" fill="#315b49"/><text x="1072" y="71" fill="#fff" class="small">New project</text>

  <rect x="35" y="125" width="1130" height="285" rx="16" class="soft"/>
  <text x="65" y="165" class="label">Chart workspace</text>
  <rect x="65" y="185" width="740" height="180" fill="#dfe5d8" stroke="#315b49" stroke-width="2"/>
  <path d="M105 220h660M105 260h660M105 300h660M105 340h660M180 205v145M260 205v145M340 205v145M420 205v145M500 205v145M580 205v145M660 205v145" class="line" opacity=".55"/>
  <rect x="840" y="185" width="285" height="180" rx="12" fill="#315b49"/>
  <text x="870" y="220" fill="#dfea96" class="small">CURRENT ROW</text><text x="870" y="292" fill="#fff" class="title">16</text><text x="925" y="292" fill="#d5dfd5" class="small">/ 60 rows</text>
  <rect x="870" y="325" width="210" height="7" rx="4" fill="#dfea96"/>

  <rect x="35" y="440" width="1130" height="280" rx="16" class="soft"/>
  <text x="65" y="480" class="label">All projects</text><text x="955" y="480" class="small">1 active · 1 completed</text>
  <text x="65" y="525" class="title">Active projects</text>
  <rect x="65" y="545" width="210" height="140" rx="12" fill="#fffefb" stroke="#315b49" stroke-width="2"/><rect x="80" y="560" width="180" height="75" fill="#dfe5d8"/><text x="80" y="662" class="label">Sheep Chart</text>
  <text x="65" y="705" class="title">Completed projects</text>
  <rect x="300" y="545" width="210" height="140" rx="12" fill="#fffefb" stroke="#315b49" stroke-width="2"/><rect x="315" y="560" width="180" height="75" fill="#dfe5d8"/><text x="315" y="662" class="label">My pixel chart</text>
</svg>
